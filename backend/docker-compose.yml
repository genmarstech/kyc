
services:
  kycdb:
    image: postgres:16
    container_name: kycdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kycdb_data:/var/lib/postgresql/data

  kyc-backend:
    image: ${KYC_IMAGE}
    container_name: kyc-backend
    dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./kyc/backend/.env
    depends_on:
      - kycdb

    ports:
      -"127.0.0.1:3240"
 

volumes:
  kycdb_data:
